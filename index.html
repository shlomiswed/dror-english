<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dror's English</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dror English">
<meta name="theme-color" content="#fff4d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#fff4d6; --ink:#2d2a32; --card:#ffffff; --green:#5cc26a; --shadow:0 6px 0 rgba(45,42,50,.18);
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
html,body{margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:var(--bg); color:var(--ink); font-family:var(--font)}
body{position:fixed; inset:0}
button{font-family:inherit; color:inherit; border:none; cursor:pointer; touch-action:manipulation; background:none; padding:0}
svg{display:block; width:100%; height:100%; overflow:visible}

.screen{position:absolute; inset:0; display:none; flex-direction:column;
  padding:max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background:radial-gradient(circle at 20% 10%, #fffaf0 0, transparent 40%), var(--bg)}
.screen.active{display:flex; animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0; transform:scale(.98)} to{opacity:1; transform:none}}

header{display:flex; align-items:center; gap:14px; min-height:84px}
header .title{flex:1; text-align:center; font-size:clamp(28px,5vmin,48px); font-weight:900}
.round{width:76px; height:76px; border-radius:50%; background:#fff; box-shadow:var(--shadow); font-size:38px; display:grid; place-items:center; flex:none; transition:transform .1s}
.round:active,.tile:active,.act:active,.opt:active,.bigbtn:active,.pill:active{transform:translateY(4px) scale(.97); box-shadow:0 2px 0 rgba(45,42,50,.18)}
.round svg{width:44px; height:44px}
.stars{display:flex; align-items:center; gap:8px; background:#fff; border-radius:40px; padding:8px 22px; box-shadow:var(--shadow); font-size:34px; font-weight:900}

/* Start */
#start{align-items:center; justify-content:center; gap:10px; text-align:center}
#start h1{margin:0; font-size:clamp(40px,8vmin,80px); letter-spacing:1px}
#start h1 span{color:#e8590c}
#start .sub{margin:0 0 10px; font-size:clamp(22px,3.5vmin,32px); opacity:.7}
.bigbtn{width:min(34vmin,200px); height:min(34vmin,200px); border-radius:50%; background:var(--green); box-shadow:0 10px 0 #3f9a4f; display:grid; place-items:center; animation:pulse 1.6s ease-in-out infinite}
.bigbtn svg{width:50%; height:50%}
@keyframes pulse{50%{transform:scale(1.06)}}

/* Dino */
.dino{flex:none}
.dino.big{width:min(48vmin,340px); height:min(48vmin,340px)}
.dino.mid{width:min(26vmin,190px); height:min(26vmin,190px)}
.dino.small{width:min(20vmin,150px); height:min(20vmin,150px)}
.dino.talk svg{animation:talk .35s ease-in-out infinite alternate}
.dino.jump svg{animation:jump .5s ease 2}
@keyframes talk{from{transform:translateY(0) rotate(0)} to{transform:translateY(-6px) rotate(-2deg)}}
@keyframes jump{40%{transform:translateY(-30px) rotate(-6deg)}}

/* Home */
.homebody{flex:1; display:flex; align-items:center; gap:16px; min-height:0}
.grid{flex:1; max-width:calc(4 * min(26vmin,260px) + 3 * clamp(12px,2.4vmin,24px) + 16px); margin:0 auto; display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(12px,2.4vmin,24px); align-content:center; max-height:100%; overflow-y:auto; padding:6px 6px 14px}
.tile{width:min(26vmin,260px); border-radius:28px; box-shadow:var(--shadow); padding:12px 10px 10px; display:flex; flex-direction:column; align-items:center; transition:transform .1s}
.tile .art{width:min(17vmin,170px); height:min(17vmin,170px)}
.tile .label{font-size:clamp(22px,3.4vmin,32px); font-weight:900; margin-top:6px}
@media (orientation:portrait){ .homebody{flex-direction:column} .homebody .grid{align-self:stretch} }

/* Topic */
#topic .body{flex:1; display:flex; align-items:center; justify-content:center; gap:4vmin; flex-wrap:wrap}
.acts{display:flex; gap:3vmin; flex-wrap:wrap; justify-content:center}
.act{width:min(28vmin,220px); height:min(28vmin,220px); border-radius:36px; background:#fff; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:min(12vmin,90px)}
.act small{font-size:clamp(18px,2.8vmin,26px); font-weight:800}

/* Learn */
.cards{flex:1; display:grid; gap:clamp(12px,2vmin,20px); grid-template-columns:repeat(auto-fit,minmax(min(26vw,170px),1fr)); align-content:center; overflow-y:auto; padding:8px}
.wcard{background:#fff; border-radius:26px; box-shadow:var(--shadow); padding:10px; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center}
.wcard .art{width:80%; height:72%}
.wcard .en{font-size:clamp(20px,3vmin,30px); font-weight:900; direction:ltr; margin-top:4px; color:#1971c2}
.pop{animation:popAnim .45s ease}
@keyframes popAnim{30%{transform:scale(1.12) rotate(-3deg)} 60%{transform:scale(.96)}}

/* Find */
#find .stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-around; min-height:0}
.ask{display:flex; align-items:center; gap:20px}
.speaker{width:min(18vmin,130px); height:min(18vmin,130px); border-radius:50%; background:#ffd43b; box-shadow:0 8px 0 #e0a800; display:grid; place-items:center}
.speaker svg{width:58%; height:58%}
.opts{display:flex; gap:clamp(14px,3vmin,30px); flex-wrap:wrap; justify-content:center; width:100%}
.opt{width:var(--opt); height:var(--opt); background:#fff; border-radius:30px; box-shadow:var(--shadow); padding:calc(var(--opt) * .07); transition:transform .1s, opacity .3s}
.opt.right{background:#d3f9d8; outline:6px solid #40c057}
.opt.wrong{animation:shake .45s; opacity:.35}
@keyframes shake{20%,60%{transform:translateX(-12px)} 40%,80%{transform:translateX(12px)}}
.dots{display:flex; gap:10px; flex:1; justify-content:center}
.dots i{width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:inset 0 0 0 3px #ccc}
.dots i.done{background:#ffd43b; box-shadow:inset 0 0 0 3px #e0a800}

/* Memory */
.mgrid{flex:1; display:grid; grid-template-columns:repeat(4,auto); justify-content:center; gap:clamp(10px,2vmin,20px); align-content:center; justify-items:center; padding:8px}
@media (orientation:portrait){ .mgrid{grid-template-columns:repeat(3,auto)} }
.mcard{width:min(30vmin,240px); aspect-ratio:1; perspective:800px}
.mcard .in{position:relative; width:100%; height:100%; transition:transform .45s; transform-style:preserve-3d; -webkit-transform-style:preserve-3d}
.mcard.flip .in{transform:rotateY(180deg)}
.mcard .f{position:absolute; inset:0; border-radius:24px; box-shadow:var(--shadow); backface-visibility:hidden; -webkit-backface-visibility:hidden; display:grid; place-items:center}
.mcard .back{background:var(--green); background-image:radial-gradient(circle at 30% 30%, #7bd88a 0 14%, transparent 15%), radial-gradient(circle at 70% 65%, #7bd88a 0 10%, transparent 11%); font-size:min(10vmin,80px); color:#fff; font-weight:900}
.mcard .front{background:#fff; transform:rotateY(180deg); padding:10%}
.mcard.done .front{background:#d3f9d8}

/* Album */
.scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px}
.album h2{margin:18px 6px 8px; font-size:30px}
.album .row{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px}
.sticker{background:#fff; border-radius:20px; box-shadow:var(--shadow); aspect-ratio:1; padding:10%}
.sticker.locked{filter:grayscale(1) brightness(1.15); opacity:.3}

/* Sleep */
#sleep{align-items:center; justify-content:center; text-align:center; background:#28305a; color:#fff}
#sleep p{font-size:clamp(26px,4.5vmin,42px); font-weight:900; margin:10px}
#sleep .gearwrap{position:absolute; top:max(14px,env(safe-area-inset-top)); left:max(16px,env(safe-area-inset-left))}

/* Overlays */
.overlay{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(45,42,50,.55); z-index:20; padding:16px}
.overlay.show{display:flex}
.panel{background:#fff; border-radius:34px; padding:24px; max-width:640px; width:100%; max-height:100%; overflow-y:auto; text-align:center; box-shadow:0 12px 0 rgba(0,0,0,.2); animation:fadeIn .3s}
.panel h2{margin:.2em 0; font-size:clamp(30px,5vmin,46px)}
.panel .earned{font-size:clamp(40px,8vmin,70px); margin:6px 0}
.row-btns{display:flex; gap:20px; justify-content:center; margin-top:12px}
.pill{border-radius:40px; background:#e7f5ff; box-shadow:var(--shadow); padding:12px 22px; font-size:22px; font-weight:800}
.pill.on{background:#5cc26a; color:#fff}

#parent .panel{text-align:right}
#parent h3{margin:20px 0 8px; font-size:22px}
#parent .opts-row{display:flex; flex-wrap:wrap; gap:10px}
#parent .note{font-size:16px; opacity:.75; line-height:1.5}

/* Hold ring on gear */
.gear{position:relative}
.gear .ring{position:absolute; inset:-6px; width:calc(100% + 12px); height:calc(100% + 12px); transform:rotate(-90deg); pointer-events:none}
.gear .ring circle{fill:none; stroke:#5cc26a; stroke-width:6; stroke-dasharray:283; stroke-dashoffset:283}
.gear.holding .ring circle{transition:stroke-dashoffset 3s linear; stroke-dashoffset:0}

/* Lesson */
.act{position:relative}
.act.done::after{content:'✓'; position:absolute; top:8px; left:8px; width:36px; height:36px; border-radius:50%; background:#40c057; color:#fff; font-size:24px; font-weight:900; display:grid; place-items:center}
.act.suggest{outline:6px solid #ffd43b; animation:pulse 1.4s ease-in-out infinite}
.lstage{flex:1; display:flex; align-items:center; justify-content:center; gap:4vmin; min-height:0; flex-wrap:wrap}
.lcard{background:#fff; border-radius:36px; box-shadow:var(--shadow); padding:2vmin 3vmin; display:flex; flex-direction:column; align-items:center; width:min(54vmin,430px)}
.lcard .art{width:min(36vmin,290px); height:min(36vmin,290px)}
.lcard .en{font-size:clamp(34px,7vmin,64px); font-weight:900; color:#1971c2; direction:ltr; line-height:1.1}
.lcard .he{font-size:clamp(20px,3.6vmin,32px); font-weight:800; opacity:.7}
.lcard .line{font-size:clamp(16px,2.6vmin,22px); direction:ltr; opacity:.6; margin-top:4px}
.lcard.enter{animation:popAnim .5s ease}
.lbtns{display:flex; flex-direction:column; align-items:center; gap:3vmin}
.nextbtn{width:min(22vmin,150px); height:min(22vmin,150px); border-radius:50%; background:var(--green); box-shadow:0 8px 0 #3f9a4f; display:grid; place-items:center}
.nextbtn svg{width:58%; height:58%}
.nextbtn.ready{animation:pulse 1.1s ease-in-out infinite}
.nextbtn:active{transform:translateY(4px)}

/* Instruction strip */
.hint{align-self:center; display:flex; align-items:center; gap:12px; margin:4px auto 8px; padding:10px 26px 10px 14px; max-width:100%;
  background:#fff; border-radius:40px; box-shadow:var(--shadow); font-size:clamp(20px,3.4vmin,32px); font-weight:800; line-height:1.25}
.hint .ico{flex:none; width:1.7em; height:1.7em; border-radius:50%; background:#ffd43b; display:grid; place-items:center; font-size:.85em}
.hint b{color:#1971c2; font-size:1.15em; direction:ltr; unicode-bidi:isolate}
.hint:empty{display:none}
.hint.static{box-shadow:none; background:#ffffffcc; padding:10px 22px}
.hint.flash{animation:popAnim .45s ease}

/* Mouse (laptop) */
@media (hover:hover){
  .tile,.act,.opt,.wcard,.sticker,.round,.speaker,.pill{transition:transform .15s}
  .tile:hover,.act:hover,.opt:hover,.wcard:hover,.round:hover,.speaker:hover{transform:translateY(-5px) scale(1.04)}
  .sticker:not(.locked):hover,.mcard:not(.flip):hover{transform:scale(1.05)}
  .mcard{transition:transform .15s}
  .tile:active,.act:active,.opt:active,.wcard:active,.round:active,.speaker:active{transform:translateY(3px) scale(.96)}
}
select.voice{font:inherit; font-size:18px; padding:10px 14px; border-radius:16px; border:2px solid #d0d7de; background:#fff; width:100%; direction:ltr}

/* Confetti */
#confetti{position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden}
#confetti i{position:absolute; top:-30px; width:16px; height:22px; border-radius:4px; animation:fall var(--d) ease-in forwards}
@keyframes fall{to{transform:translate(var(--x), 110vh) rotate(var(--r))}}
</style>
</head>
<body>

<section id="start" class="screen active">
  <div class="dino big" data-mood="happy"></div>
  <h1 dir="ltr"><span>Dror's</span> English</h1>
  <p class="sub">האנגלית של דרור</p>
  <button id="startBtn" class="bigbtn" aria-label="התחל">
    <svg viewBox="0 0 100 100"><polygon points="32,20 82,50 32,80" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/></svg>
  </button>
  <div class="hint static">👆 לחץ על הכפתור הירוק כדי להתחיל</div>
</section>

<section id="home" class="screen">
  <header>
    <button class="round" id="albumBtn" aria-label="אלבום">📒</button>
    <div class="stars">⭐ <span id="starCount">0</span></div>
    <div style="flex:1"></div>
    <button class="round gear" data-gear aria-label="הורים">⚙️<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg></button>
  </header>
  <button class="hint" aria-label="הוראה"></button>
  <div class="homebody">
    <div class="dino mid" data-mood="happy"></div>
    <div id="topics" class="grid"></div>
  </div>
</section>

<section id="topic" class="screen">
  <header>
    <button class="round" data-go="home" aria-label="בית">🏠</button>
    <div class="title" id="topicTitle"></div>
    <div style="width:76px"></div>
  </header>
  <button class="hint" aria-label="הוראה"></button>
  <div class="body">
    <div class="dino big" data-mood="happy"></div>
    <div class="acts">
      <button class="act" data-act="lesson">📖<small>שיעור</small></button>
      <button class="act" data-act="learn">👂<small>מקשיבים</small></button>
      <button class="act" data-act="find">🔍<small>מוצאים</small></button>
      <button class="act" data-act="memory">🃏<small>זיכרון</small></button>
    </div>
  </div>
</section>

<section id="lesson" class="screen">
  <header>
    <button class="round" data-go="topic" aria-label="חזרה">↩️</button>
    <div class="dots" id="lessonDots"></div>
    <div style="width:76px"></div>
  </header>
  <button class="hint" aria-label="הוראה"></button>
  <div class="lstage">
    <div class="dino mid" data-mood="happy"></div>
    <button class="lcard" id="lessonCard" aria-label="שוב"></button>
    <div class="lbtns">
      <button class="speaker" id="lessonAgain" aria-label="שוב">
        <svg viewBox="0 0 100 100"><path d="M18 38 H34 L56 20 V80 L34 62 H18Z" fill="#2d2a32" stroke="#2d2a32" stroke-width="6" stroke-linejoin="round"/><path d="M68 34 Q78 50 68 66 M78 24 Q94 50 78 76" fill="none" stroke="#2d2a32" stroke-width="7" stroke-linecap="round"/></svg>
      </button>
      <button class="nextbtn" id="lessonNext" aria-label="הבא">
        <svg viewBox="0 0 100 100"><path d="M78 50 H26 M46 28 L24 50 L46 72" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</section>

<section id="learn" class="screen">
  <header>
    <button class="round" data-go="topic" aria-label="חזרה">↩️</button>
    <div class="title" id="learnTitle"></div>
    <div class="dino small" data-mood="happy" style="width:76px;height:76px"></div>
  </header>
  <button class="hint" aria-label="הוראה"></button>
  <div class="cards" id="learnCards"></div>
</section>

<section id="find" class="screen">
  <header>
    <button class="round" data-go="topic" aria-label="חזרה">↩️</button>
    <div class="dots" id="findDots"></div>
    <div style="width:76px"></div>
  </header>
  <button class="hint" aria-label="הוראה"></button>
  <div class="stage">
    <div class="ask">
      <div class="dino mid" data-mood="happy"></div>
      <button class="speaker" id="repeatBtn" aria-label="שוב">
        <svg viewBox="0 0 100 100"><path d="M18 38 H34 L56 20 V80 L34 62 H18Z" fill="#2d2a32" stroke="#2d2a32" stroke-width="6" stroke-linejoin="round"/><path d="M68 34 Q78 50 68 66 M78 24 Q94 50 78 76" fill="none" stroke="#2d2a32" stroke-width="7" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="opts" id="findOpts"></div>
  </div>
</section>

<section id="memory" class="screen">
  <header>
    <button class="round" data-go="topic" aria-label="חזרה">↩️</button>
    <div class="title">🃏</div>
    <div class="dino small" data-mood="happy" style="width:76px;height:76px"></div>
  </header>
  <button class="hint" aria-label="הוראה"></button>
  <div class="mgrid" id="memGrid"></div>
</section>

<section id="album" class="screen">
  <header>
    <button class="round" data-go="home" aria-label="בית">🏠</button>
    <div class="title">📒 האלבום של דרור</div>
    <div style="width:76px"></div>
  </header>
  <button class="hint" aria-label="הוראה"></button>
  <div class="scroll album" id="albumBody"></div>
</section>

<section id="sleep" class="screen">
  <div class="gearwrap"><button class="round gear" data-gear aria-label="הורים">⚙️<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg></button></div>
  <div class="dino big" data-mood="sleep"></div>
  <p>דינו הלך לישון 💤</p>
  <p style="opacity:.8">נשחק שוב מחר!</p>
</section>

<div id="celebrate" class="overlay">
  <div class="panel">
    <div class="dino mid" data-mood="cheer" style="margin:0 auto"></div>
    <h2>כל הכבוד דרור!</h2>
    <div class="earned" id="earned"></div>
    <div class="hint static"></div>
    <div class="row-btns">
      <button class="round" id="againBtn" aria-label="שוב" style="background:var(--green);box-shadow:0 6px 0 #3f9a4f">🔁</button>
      <button class="round" id="celebHome" aria-label="חזרה לנושא">↩️</button>
    </div>
  </div>
</div>

<div id="parent" class="overlay"><div class="panel" id="parentPanel"></div></div>
<div id="confetti"></div>

<!-- Pre-recorded neural voice clips (made by tools/make_voice.py); without it the app falls back to the browser voice -->
<script src="audio/clips.js" onerror="window.CLIPS = {}"></script>
<script src="sounds/sounds.js" onerror="window.ANIMAL_SOUNDS = {}"></script>
<script>
'use strict';
/* ================= ART ================= */
const K = '#2d2a32';
const O = `stroke="${K}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`; // a stroke-width placed BEFORE ${O} overrides it (first attribute wins)
const eye = (x, y, r = 4) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${K}"/><circle cx="${x + r * .35}" cy="${y - r * .35}" r="${r * .35}" fill="#fff"/>`;
const cheek = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="5" ry="3" fill="#ff8fa3" opacity=".7"/>`;
const shine = (x, y, rot = 20) => `<ellipse cx="${x}" cy="${y}" rx="4" ry="8" fill="#fff" opacity=".55" transform="rotate(${rot} ${x} ${y})"/>`;

const ANIMALS = {

  if (checkLimit()) return;
  renderHome(); show('home');
  hint('home', ...HOME_HINT, [he('שלום דרור! בוא נלמד אנגלית'), en('Hello Dror!')]);
};
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
  sfx.pop();
  if (b.dataset.go === 'home') goHome(); else if (!checkLimit()) openTopic(cur);
});
document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
  sfx.pop(); if (checkLimit()) return;
  const act = b.dataset.act, game = { find: startFind, memory: startMemory }[act];
  if (act === 'lesson') return startLesson();
  if (act === 'learn') return startLearn();
  // Games come after the lesson: if it wasn't done yet, teach first and then go straight into the chosen game.
  if (settings.lessonFirst && !lessonDone(cur)) return startLesson(game, [he('קודם נלמד, ואחר כך נשחק!')]);
  game();
});
$('#lessonNext').onclick = lessonNext;
$('#lessonAgain').onclick = () => { sfx.pop(); if (lesson) say(lesson.parts); };
$('#lessonCard').onclick = () => { if (!lesson || lesson.i < 0) return; const c = $('#lessonCard'); c.classList.remove('enter'); void c.offsetWidth; c.classList.add('enter'); sfx.pop(); say([en(lesson.t.items[lesson.i][0])]); };
$('#albumBtn').onclick = () => { sfx.pop(); renderAlbum(); };
$('#repeatBtn').onclick = () => { sfx.pop(); ask(); };
$('#againBtn').onclick = () => { $('#celebrate').classList.remove('show'); sfx.pop(); if (!checkLimit()) afterCelebrate(); };
// "Back" from the celebration returns into the current topic, not the main menu.
$('#celebHome').onclick = () => { $('#celebrate').classList.remove('show'); sfx.pop(); if (cur) openTopic(cur); else goHome(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) { try { speechSynthesis.cancel(); } catch (e) { } if (curClip) curClip.stop(); } else if (ac) audio(); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
// Keyboard: space or enter replays the word in the "find" game
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && $('#find').classList.contains('active')) { e.preventDefault(); ask(); }
  if ($('#lesson').classList.contains('active')) {
    if (e.key === ' ') { e.preventDefault(); if (lesson) say(lesson.parts); }
    if (e.key === 'Enter' || e.key === 'ArrowLeft') { e.preventDefault(); lessonNext(); }
  }
});
document.addEventListener('dblclick', e => e.preventDefault());

paintDinos();
// Used by tools/make_voice.py (Edge --dump-dom) to get the list of phrases to record.
if (location.search.includes('dump-phrases')) { const pre = document.createElement('pre'); pre.id = 'phrases'; pre.textContent = JSON.stringify(allPhrases()); document.body.replaceChildren(pre); }
// Browsers usually block speech before the first click; try anyway, and repeat when the start screen is clicked anywhere.
setTimeout(() => { if ($('#start').classList.contains('active')) say([he('לחץ על הכפתור הירוק כדי להתחיל')]); }, 800);
$('#start').addEventListener('click', e => { if (!e.target.closest('#startBtn')) say([he('לחץ על הכפתור הירוק כדי להתחיל')]); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
</html>
